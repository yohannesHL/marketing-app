name: Customer connections

on:
  pull_request:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-connections-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Migration, security and pilot gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      CONNECTION_MODE: mock
      ADS_MODE: mock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install trusted media inspection runtime
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Generate Prisma client
        run: npm exec --workspace @launchpad/web -- prisma generate
      - name: Apply complete migration history to a fresh database
        env:
          DATABASE_URL: file:${{ runner.temp }}/connection-migrations.db
        run: |
          touch "$RUNNER_TEMP/connection-migrations.db"
          npm exec --workspace @launchpad/web -- prisma migrate deploy
      - name: Check security, ownership, provider failures and read-only pilot CLI
        shell: bash
        run: |
          set -o pipefail
          npm run test:security 2>&1 | tee security-results.txt
      - name: Type check
        run: npm exec --workspace @launchpad/web -- tsc --noEmit
      - name: Retain fixture security evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: connection-security-${{ github.sha }}
          path: security-results.txt
          if-no-files-found: ignore
          retention-days: 14

  app-journeys:
    name: App journeys (${{ matrix.browser }})
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      CI: "true"
      BASE_URL: http://127.0.0.1:3145
      CONNECTION_MODE: mock
      ADS_MODE: mock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install trusted media inspection runtime
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Generate Prisma client
        run: npm exec --workspace @launchpad/web -- prisma generate
      - name: Install browser and system dependencies
        run: npm exec -- playwright install --with-deps ${{ matrix.browser }}
      - name: Build isolated app and exercise current customer journeys
        # These are app tests. The separately skipped Storybook/ATDD placeholders
        # require another runner and are not counted as customer-flow evidence.
        run: >-
          npm run test:e2e --
          tests/e2e/home.spec.ts
          tests/e2e/customer-security.spec.ts
          tests/e2e/customer-connections.spec.ts
          tests/e2e/ads-proxy.spec.ts
          tests/e2e/campaign-wizard.spec.ts
          tests/e2e/social-publishing.spec.ts
          tests/e2e/youtube-connections.spec.ts
          tests/e2e/meta-publishing-connections.spec.ts
          tests/e2e/tiktok-connections.spec.ts
          tests/e2e/linkedin-connections.spec.ts
          tests/e2e/x-connections.spec.ts
          --project=${{ matrix.browser }}
      - name: Retain fixture browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: connection-journeys-${{ matrix.browser }}-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14


  social-delivery-journeys:
    name: Mock social delivery (${{ matrix.browser }})
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      CI: "true"
      BASE_URL: http://127.0.0.1:3156
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install trusted media inspection runtime
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Generate Prisma client
        run: npm exec --workspace @launchpad/web -- prisma generate
      - name: Install browser and system dependencies
        run: npm exec -- playwright install --with-deps ${{ matrix.browser }}
      - name: Review and publish decoded fixture media through all real app routes
        # Each matrix host has a fresh DB/providers. This dedicated runner forces
        # mock mode and synthetic allowances; it cannot publish to live accounts.
        run: npm run test:e2e:delivery -- --project=${{ matrix.browser }}
      - name: Retain actual mock delivery evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: social-delivery-${{ matrix.browser }}-${{ github.sha }}
          path: |
            social-delivery-report/
            test-results/social-delivery/
          if-no-files-found: ignore
          retention-days: 14
